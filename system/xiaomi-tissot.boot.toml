# Flare boot composition for the Xiaomi Mi A1 (tissot): the first hardware
# port. What runs:
#   * the framekernel on all 8 cores, its console drawn on the panel (the
#     boot loader's splash framebuffer, see hardware/boards/xiaomi/tissot);
#   * the Linux personality with a small root filesystem: busybox, the
#     Linux ABI tests and droid's Android apps, all printing to the panel.
#   * native drivers for what is easy (after QRT's, which runs on this
#     phone): the volume-up key and hall sensor (TLMM pins, polled) as
#     /dev/input/event0, and the debug UART as a second console.
# Nothing here powers the phone off; hold the power key to turn it off.

name = "xiaomi-tissot"
board = "xiaomi/tissot"

# The debug UART: the console service and the kernel log (also kept on
# the screen). Without a cable on the test pads it writes to nobody.
[component.uart]
manifest = "drivers/qcom/uart-msm"
grants = ["uart=mmio:uart0", "console=endpoint:console:recv", "klog=klog:read+write"]
restart = "on-failure"
max-restarts = 2

[component.keys]
manifest = "drivers/qcom/gpio-keys-tlmm"
grants = [
    "key-115=mmio:volume-up",    # KEY_VOLUMEUP
    "switch-0=mmio:hall-sensor", # SW_LID
    "events=endpoint:keys:recv",
    "input=input:keys",
    "console=endpoint:console:send:badge=2",
]
restart = "on-failure"

[linux]
init = ["/bin/sh", "/etc/rc"]
env = ["PATH=/bin:/sbin:/usr/bin", "HOME=/root", "TERM=vt100"]
control = true
rootfs = "minimal"
