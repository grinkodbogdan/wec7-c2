# Flare boot composition: the components started at boot and *exactly* the
# capabilities each receives. Nothing that is not granted here is reachable.
#
# Grant syntax: "<local-name>=<kind>:<target>[:<rights>][:badge=<n>]"
#   mmio:<device>[#n]        map register window n of a described device
#   irq:<device>[#n]         interrupt line n of a described device
#   endpoint:<name>:<rights> IPC endpoint (rights: send, recv, grant)
#   klog:<rights>            kernel log (read, write)

name = "qemu-virt-phone-demo"
board = "qemu/virt-phone"

# Power off once these have finished: native instances (exited, or retired
# after exhausting their restarts) and "linux" (the Linux init process).
halt-when-finished = ["hello", "intruder", "storage-test", "linux"]

[component.uart]
manifest = "drivers/common/uart-pl011"
grants = [
    "uart=mmio:uart0",
    "uart-irq=irq:uart0",
    "console=endpoint:console:recv",
    "klog=klog:read+write",
]
restart = "on-failure"
max-restarts = 3

[component.rtc]
manifest = "drivers/common/rtc-pl031"
grants = ["regs=mmio:rtc0", "rtc=endpoint:rtc:recv", "console=endpoint:console:send:badge=4"]
restart = "on-failure"

[component.keys]
manifest = "drivers/common/gpio-keys-pl061"
grants = [
    "regs=mmio:gpio0",
    "irq=irq:gpio0",
    "events=endpoint:keys:recv",
    "console=endpoint:console:send:badge=5",
]
restart = "on-failure"

[component.storage]
manifest = "drivers/virtio/blk"
grants = [
    "regs=mmio:virtio31",
    "irq=irq:virtio31",
    "dma=dma:12k",
    "blk=endpoint:storage:recv",
    "console=endpoint:console:send:badge=6",
]
restart = "on-failure"

# Display: the panel scans out the 'display' shared memory, which Linux
# sees as /dev/dri/card0.
[component.display]
manifest = "drivers/display/ramfb"
grants = [
    "fwcfg=mmio:fwcfg0",
    "dma=dma:4k",
    "fb=shm:display:4m",
    "display=endpoint:display:recv",
    "console=endpoint:console:send:badge=8",
]
restart = "on-failure"

# Touch and keys: each driver feeds one Linux evdev device.
[component.touch]
manifest = "drivers/virtio/input"
grants = [
    "regs=mmio:virtio30",
    "irq=irq:virtio30",
    "dma=dma:8k",
    "irq-ep=endpoint:touch-irq:recv",
    "input=input:touchscreen",
    "console=endpoint:console:send:badge=9",
]
restart = "on-failure"

[component.keyboard]
manifest = "drivers/virtio/input"
grants = [
    "regs=mmio:virtio29",
    "irq=irq:virtio29",
    "dma=dma:8k",
    "irq-ep=endpoint:keyboard-irq:recv",
    "input=input:keyboard",
    "console=endpoint:console:send:badge=10",
]
restart = "on-failure"

[component.storage-test]
manifest = "apps/storage-test"
grants = [
    "storage=endpoint:storage:send",
    "rtc=endpoint:rtc:send",
    "console=endpoint:console:send:badge=7",
]

[component.hello]
manifest = "apps/hello"
grants = ["console=endpoint:console:send:badge=1"]

[component.spinner]
manifest = "apps/spinner"
grants = ["console=endpoint:console:send:badge=2"]

[component.intruder]
manifest = "apps/intruder"
grants = ["console=endpoint:console:send:badge=3"]
restart = "on-failure"
max-restarts = 1

# The Linux personality: pid 1 runs from the root filesystem that
# `cargo xtask build` assembles (compat/linux/rootfs + busybox + test programs).
[linux]
init = ["/bin/sh", "/etc/rc"]
env = ["PATH=/bin:/sbin:/usr/bin", "HOME=/root", "TERM=vt100"]
# Linux root may stop, start and restart components through /dev/flarectl.
control = true
# The display shared memory as Linux's DRM/KMS device /dev/dri/card0.
display = "display"
