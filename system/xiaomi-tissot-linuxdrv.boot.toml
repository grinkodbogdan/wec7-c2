# The Xiaomi Mi A1 with Linux's own drivers for the hard hardware: what
# system/xiaomi-tissot.boot.toml runs, plus the Linux driver host
# (docs/linux-drivers.md) given the eMMC, the SD card, the touch screen's
# I2C bus, USB, and what those need: the clock controller, the pin
# controller, the RPM co-processor (power rails), SMEM and the PMICs. Linux
# probes them with mainline's device tree for this phone, trimmed to exactly
# that.
#
# Two images: boot.img (the kernel, the minimal root filesystem, the driver
# host) and userdata.img (the full root filesystem, compressed):
#   fastboot flash boot_b boot.img && fastboot flash userdata userdata.img
#
# The pin controller goes to Linux as a whole, so the volume and power keys
# are Linux's (gpio-keys, pm8941-pwrkey) here, not the native TLMM driver's.
#
# Linux's drivers see only what is granted below; the panel and the CPUs
# stay Flare's. The driver host reports what Linux found and hands the
# touch screen and keys to Flare; then the Arcan phone shell starts on the
# panel (FLARE_BOOT=quick in /etc/rc).

name = "xiaomi-tissot-linuxdrv"
board = "xiaomi/tissot"

# No native UART driver here: the UART shares BLSP1's bus clock with the
# I2C controllers, which Linux's I2C driver switches off when idle, and a
# register access with the clock off hangs the CPU (QRT 0.21.16). The log
# is on the screen.

# The panel: the display engine keeps the boot loader's setup, scanning
# this shared memory as 32-bit pixels instead of the splash buffer (QRT's
# way on this phone). Linux sees it as /dev/dri/card0; the kernel console
# moves there until the phone shell draws.
[component.display]
manifest = "drivers/qcom/mdp5-display"
grants = ["mdp=mmio:mdp", "fb=shm:display:9m", "display=endpoint:display:recv"]
restart = "on-failure"

[linux]
init = ["/bin/sh", "/etc/rc"]
# FLARE_BOOT=quick: the driver host first, no test suites (/etc/rc).
env = ["PATH=/bin:/sbin:/usr/bin", "HOME=/root", "TERM=vt100", "FLARE_BOOT=quick"]
control = true
# The kernel carries the minimal root filesystem (and the driver host); the
# full one (Arcan, Mesa, the phone shell, ART) is userdata.img on the
# userdata partition, read through Linux's eMMC driver at boot.
rootfs = "userdata"
display = "display"
# All of the phone's hardware in Linux's device tree goes to Linux's own
# drivers, as on a Linux phone: eMMC, touch, keys, USB, the PMICs (battery
# gauge, backlight, vibrator, RTC), sensors, then - once the driver host has
# their firmware ready - the GPU, Wi-Fi and audio. Except what Flare's
# drivers hold (the panel: [component.display]) and what the board's
# linux.txt drops (the CPUs' own hardware, what can reset the phone).
devicetree = true
# Qualcomm's secure-world calls (SCM, SMC Calling Convention "SiP" ids,
# 32- and 64-bit): loading the GPU's zap shader, the Wi-Fi and DSP firmware
# (PAS), the GPU IOMMU's secure page tables. Never PSCI (the CPUs' power):
# that stays Flare's.
smc = ["0x02000000..0x02ffffff", "0x42000000..0x42ffffff", "0x82000000..0x82ffffff", "0xc2000000..0xc2ffffff"]
# Linux's touch screen and keys, handed back to Flare (/dev/input/event0, 1)
# for the phone shell.
inputs = ["touch", "keys"]
# fdb over USB: Linux's DWC3 controller in device mode, its serial gadget
# (the computer's /dev/ttyACM0) carrying Flare's /dev/fdb.
serials = ["fdb"]
