[workspace]
resolver = "2"
members = [
    "interfaces/abi",
    "libs/config",
    "libs/cap",
    "libs/rt",
    "tools/fhd",
    "component-manager",
    "kernel",
    "drivers/common/uart-pl011",
    "drivers/common/rtc-pl031",
    "drivers/common/gpio-keys-pl061",
    "drivers/virtio/blk",
    "drivers/virtio/input",
    "drivers/virtio/console",
    "compat/linux/fdbd",
    "tools/fdb",
    "drivers/display/ramfb",
    "apps/storage-test",
    "apps/hello",
    "apps/spinner",
    "apps/intruder",
    "compat/linux/std-test",
    "compat/android/droid",
    "xtask",
]
# Crates that build and test on the host. The kernel and the components are
# bare-metal arm64 crates; build them with `cargo xtask build`.
default-members = [
    "tools/fdb",
    "compat/android/droid",
    "interfaces/abi",
    "libs/config",
    "libs/cap",
    "tools/fhd",
    "component-manager",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[profile.release]
debug = true

# droid ships in the Linux root filesystem: keep it small.
[profile.release.package.droid]
debug = false
