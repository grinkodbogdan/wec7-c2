[package]
name = "flare-kernel"
description = "The Flare framekernel (arm64)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "flare-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
flare-abi = { path = "../interfaces/abi" }
flare-cap = { path = "../libs/cap" }
# Inflate (no_std, no allocation in its core): compressed root filesystems.
miniz_oxide = { version = "0.8", default-features = false }

[build-dependencies]
miniz_oxide = "0.8"
flare-fhd = { path = "../tools/fhd" }
flare-cm = { path = "../component-manager" }
flare-abi = { path = "../interfaces/abi" }
